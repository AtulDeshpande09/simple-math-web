<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Quadratic Equation Solver</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 2em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to top right, #ede7f6, #d1c4e9);
            color: #4a148c;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 2.7em;
            margin-bottom: 1.5em;
            color: #6a1b9a;
        }

        form {
            background-color: #ffffffdd;
            padding: 2em;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
        }

        form div {
            font-size: 1.2em;
            margin-bottom: 1.2em;
        }

        input[type="text"],
        input[type="number"],
        input {
            padding: 10px;
            font-size: 1em;
            border-radius: 8px;
            border: 1px solid #b39ddb;
            width: 60px;
            text-align: center;
            margin: 0 5px;
        }

        input[type="submit"] {
            background-color: #8e24aa;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        input[type="submit"]:hover {
            background-color: #6a1b9a;
            transform: scale(1.05);
        }

        .solution-box {
            margin-top: 2em;
            background-color: #f3e5f5;
            padding: 1.2em;
            border-radius: 12px;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 1.2em;
            color: #4a0072;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media screen and (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            input {
                width: 50px;
            }

            form {
                padding: 1.5em;
            }
        }
    </style>
</head>

<body>

    <h1>📘 Solve Quadratic Equation</h1>

    <form method="POST" action="/quad">
        <div>
            Solve: 
            <input name="a" placeholder="a"> x² + 
            <input name="b" placeholder="b"> x + 
            <input name="c" placeholder="c"> = 0
        </div>
        <input type="submit" value="Solve">
    </form>

    {% if sol %}
        <div class="solution-box">
            ✅ Solution:<br><br>
            x₁ = {{ sol[0] }}<br>
            x₂ = {{ sol[1] }}
        </div>
    {% endif %}

</body>
</html>
